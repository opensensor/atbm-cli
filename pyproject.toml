[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atbm6441-cli"
version = "0.1.0"
description = "Cross-platform CLI tool for flashing firmware to AltoBeam ATBM6441 WiFi IoT chips via UART"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Matt", email = "matteius@example.com"},
]
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "tqdm>=4.64",
]

[project.scripts]
atbm6441-cli = "atbm6441_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
